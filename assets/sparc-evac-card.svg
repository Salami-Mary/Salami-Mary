      <text x="584" y="208" text-anchor="middle">Information-state test</text>
      <rect x="696" y="186" width="114" height="34" rx="17" fill="none" stroke="#5f8a8e"/>
      <text x="753" y="208" text-anchor="middle">GIS checks</text>
    </g>
    <text x="48" y="256" fill="#9fbcbb" font-size="16">Eaton Fire, January 2025 · Research in progress</text>
